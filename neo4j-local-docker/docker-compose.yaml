services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j_ds
    restart: unless-stopped
    ports:
      - "7475:7474"  # HTTP (Neo4j Browser)
      - "7688:7687"  # Bolt protocol
    volumes:
      - neo4j_data_ds:/data
    environment:
      - NEO4J_AUTH=none

volumes:
  neo4j_data_ds:
